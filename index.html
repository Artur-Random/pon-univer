<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2744;--blue:#2e4aad;--accent:#c0902a;
  --cream:#f7f4ee;--warm:#e8e2d8;--tdark:#1a1a2e;--tmid:#3d3d5c;
  --green:#2a6b4a;--teal:#1e6b7a;--red:#8f3d3d;--brown:#7a5c1e;
  --slate:#3a6b8f;--olive:#5a6b3a;--gray:#5a5a5a;--endow:#8f6b1e;--purple:#5c3d8f;
  --sh:0 4px 20px rgba(26,39,68,.15);--shsm:0 2px 8px rgba(26,39,68,.1);
}
body{
  font-family:'Nunito',sans-serif;background:var(--cream);color:var(--tdark);padding:0 0 60px;
  background-image:radial-gradient(ellipse at 10% 10%,rgba(46,74,173,.05) 0%,transparent 50%),

}
h1.t{font-family:'Playfair Display',serif;font-size:clamp(14px,2vw,22px);font-weight:700;color:var(--navy);text-align:center;margin-bottom:4px;line-height:1.3}
h2.st{font-size:10px;font-weight:700;color:var(--accent);text-align:center;margin-bottom:28px;letter-spacing:.12em;text-transform:uppercase}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:32px 14px 0}

/* Accordion */
.accordion-container{display:flex;flex-direction:column;gap:8px;width:100%;max-width:1460px}
.accordion-item{width:100%}
.accordion-header{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  padding:12px 16px;background:white;border:none;cursor:pointer;
  border-left:5px solid transparent;border-radius:8px;box-shadow:var(--shsm);
  text-align:left;transition:box-shadow .2s;font-family:'Nunito',sans-serif;
}
.accordion-header:hover,.accordion-header.open{box-shadow:var(--sh)}
.accordion-header-text{flex:1;min-width:0}
.accordion-title{display:block;font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--navy);line-height:1.3}
.accordion-subtitle{display:block;font-size:9.5px;color:var(--tmid);margin-top:2px;font-style:italic;line-height:1.4}
.accordion-chevron{font-size:18px;color:var(--tmid);margin-left:12px;transition:transform .3s;line-height:1;flex-shrink:0}
.accordion-header.open .accordion-chevron{transform:rotate(180deg)}
.accordion-content{max-height:0;overflow:hidden;transition:max-height .4s ease}
.accordion-content-inner{padding:12px 0}

/* Group divider */
.group-header{font-size:9px;font-weight:700;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:20px 0 8px;width:100%}

/* Grid */
.grid-layout{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

/* Card */
.card{background:white;border-radius:10px;padding:11px 13px;box-shadow:var(--shsm);border-top:4px solid transparent;transition:box-shadow .2s;display:flex;gap:12px;align-items:center}
.card:hover{box-shadow:var(--sh)}
.card-text{flex:1;min-width:0}
.card .role{font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.6;margin-bottom:4px;line-height:1.4}
.card .name{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;line-height:1.3;color:var(--navy);margin-bottom:2px}
.card .deg{font-size:10px;color:var(--tmid);font-style:italic}

/* Avatar */
.avatar,.avatar-placeholder{width:50px;height:50px;border-radius:50%;flex-shrink:0}
.avatar{object-fit:cover}
.avatar-placeholder{display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;font-family:'Nunito',sans-serif}

/* Section notes */
.section-notes{padding:4px 0 8px;display:flex;flex-direction:column;gap:5px}
.note-item{font-size:11px;color:var(--tmid);font-style:italic}

@media(max-width:1050px){.grid-layout{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
@media(max-width:600px){.grid-layout{grid-template-columns:1fr}}

/* Navigation */
.main-nav{background:white;position:sticky;top:0;z-index:1000;box-shadow:var(--shsm);margin-bottom:24px}
.nav-container{max-width:1500px;margin:0 auto;display:flex;gap:8px;padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-btn{padding:8px 16px;border:none;background:transparent;border-radius:20px;font-weight:600;font-size:13px;color:var(--tmid);cursor:pointer;transition:all .2s;white-space:nowrap;font-family:'Nunito',sans-serif}
.nav-btn:hover{background:var(--warm);color:var(--navy)}
.nav-btn.active{background:var(--navy);color:white}

/* Sections */
.main-section{display:none;width:100%}
.main-section.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* Placeholder */
.placeholder-card{text-align:center;background:white;padding:50px 20px;border-radius:12px;box-shadow:var(--shsm);max-width:500px;margin:60px auto;border-top:4px solid var(--warm)}

/* Footer */
.main-footer{background:white;border-top:1px solid var(--warm);margin-top:60px;padding:20px 14px;text-align:center}
.footer-container{max-width:1500px;margin:0 auto;font-size:11px;color:var(--tmid);opacity:.8;line-height:1.4}
</style>
</head>

function getInitials(name) {
  const p = name.trim().split(/\s+/);
  return (p[0] ? p[0][0] : '') + (p[1] ? p[1][0] : '');
}

function renderCard(person, color) {
  if (person.vacant) {
    return `<div class="card" style="border-top-color:${color}">
      <div class="avatar-placeholder" style="background:#c0392b">?</div>
      <div class="card-text">
        <div class="role" style="color:#c0392b;opacity:1">${person.name}</div>
        <div class="deg" style="color:#c0392b">${person.deg}</div>
      </div>
    </div>`;
  }
  const avatar = person.photo
    ? `<img class="avatar" src="${person.photo}" alt="${person.name}">`
    : `<div class="avatar-placeholder" style="background:${color}">${getInitials(person.name)}</div>`;
  return `<div class="card" style="border-top-color:${color}">
    ${avatar}
    <div class="card-text">
      ${person.role ? `<div class="role">${person.role}</div>` : ''}
      <div class="name">${person.name}</div>
      ${person.deg ? `<div class="deg">${person.deg}</div>` : ''}
      ${person.note ? `<div class="deg" style="margin-top:3px">${person.note}</div>` : ''}
    </div>
  </div>`;
}

function renderStructure() {
  const container = document.getElementById('org-structure');
  let html = '';
  let lastGroup = '__none__';

  for (const section of orgData) {
    if (section.group !== null && section.group !== lastGroup) {
      html += `<div class="group-header">${section.group}</div>`;
      lastGroup = section.group;
    }
    const notesHtml = (section.notes || []).map(n => `<div class="note-item">${n}</div>`).join('');
    const cardsHtml = section.staff.map(p => renderCard(p, section.color)).join('');
    html += `<div class="accordion-item">
      <button class="accordion-header" style="border-left-color:${section.color}">
        <div class="accordion-header-text">
          <span class="accordion-title">${section.title}</span>
          ${section.subtitle ? `<span class="accordion-subtitle">${section.subtitle}</span>` : ''}
        </div>
        <span class="accordion-chevron">&#9662;</span>
      </button>
      <div class="accordion-content">
        <div class="accordion-content-inner">
          ${notesHtml ? `<div class="section-notes">${notesHtml}</div>` : ''}
          ${cardsHtml ? `<div class="grid-layout">${cardsHtml}</div>` : ''}
        </div>
      </div>
    </div>`;
  }

  container.innerHTML = html;

  document.querySelectorAll('.accordion-header').forEach(header => {
    header.addEventListener('click', () => {
      header.classList.toggle('open');
      const content = header.nextElementSibling;
      content.style.maxHeight = header.classList.contains('open')
        ? content.scrollHeight + 'px'
        : '0';
    });
  });
}

renderStructure();

function renderPlaceholders() {
  ['mgpu', 'rights', 'pass', 'discipline'].forEach(id => {
    const sec = document.getElementById('sec-' + id);
    if (sec && !sec.innerHTML.trim()) {
      sec.innerHTML = `<div class="placeholder-card">

        <p style="color:var(--tmid);font-size:14px;font-style:italic;">Скоро тут будет информация!</p>
      </div>`;
    }
  });
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.main-section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-' + btn.dataset.section).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
